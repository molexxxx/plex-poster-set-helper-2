name: Bug report
description: Something crashes, errors, or doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If a poster landed on the wrong title or a set finds no match, the **Poster or matching problem** form asks for the details that help most.

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the status bar and under **Settings → Application**.
      placeholder: "2.11.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options:
        - Windows installer
        - Linux AppImage
        - Linux .deb
        - Docker
        - Unraid
        - Built from source
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where in the app?
      options:
        - Library Browser
        - Creators
        - Collections
        - Manual Import
        - Scheduler
        - Title Mappings
        - Reset Posters
        - Settings or Plex sign-in
        - First-run browser check or Browser Engine
        - Updates
        - Docker web page
        - Somewhere else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any error message shown in the app.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Library Browser
        2. Pick a movie and open its sets
        3. Click Apply on a MediUX set
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?

  - type: input
    id: link
    attributes:
      label: Set or poster link
      description: The MediUX or ThePosterDB link involved, if any.
      placeholder: https://mediux.pro/sets/12345

  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: |
        Choose **Copy diagnostics** in the log menu (the **...** button in the log drawer) and paste it here, then add the relevant lines. Select lines in the drawer to copy them, or use **Copy** for everything shown. Logs are saved one file per day as `app-YYYY-MM-DD.log`: **Save a copy** (desktop) or **Download logs** (Docker) in the same menu gives you a file to attach. In Docker they are also in `docker logs plex-poster-helper-2` and `/config/app/logs/`.
      render: text

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images or a screen recording into this box.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this hasn't been reported.
          required: true
        - label: I removed any Plex tokens (`X-Plex-Token=...`) and API keys from what I pasted.
          required: true
