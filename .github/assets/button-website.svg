<svg width="340" height="68" viewBox="0 0 340 68" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Visit the website">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4b630"/><stop offset="1" stop-color="#e5a00d"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="btn"><rect x="6" y="4" width="328" height="56" rx="14"/></clipPath>
    <filter id="shadow" x="-5%" y="-15%" width="110%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".3"/></filter>
    <style>
      @keyframes sweep{0%{transform:translateX(-140px)}55%,100%{transform:translateX(400px)}}
      @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}
      .sweep{animation:sweep 5s ease-in-out infinite}
      .arrow{animation:nudge 1.8s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){*{animation:none!important}}
    </style>
  </defs>
  <rect x="6" y="4" width="328" height="56" rx="14" fill="url(#fill)" filter="url(#shadow)"/>
  <g clip-path="url(#btn)">
    <rect class="sweep" x="0" y="0" width="120" height="68" fill="url(#shine)"/>
    <rect x="6" y="4" width="328" height="1.5" fill="#fff" fill-opacity=".35"/>
  </g>
  <rect x="6.5" y="4.5" width="327" height="55" rx="13.5" stroke="#9a6a04" stroke-opacity=".55"/>
  <svg x="30" y="20" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1205" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
  <text x="170" y="32" dominant-baseline="central" text-anchor="middle" font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1a1205">Visit the website</text>
  <g class="arrow"><svg x="286" y="20" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a1205" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></g>
</svg>
